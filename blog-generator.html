#outputCard {

}

#copyBtn {

#copyBtn:hover { background: #163d4d; }
#retryBtn {

}
#retryBtn:hover { background: #f0f5f7; }

.spinner {

color: #888;

.dot-anim::after {

@keyframes dots {

  </div>

<button id="generateBtn">Generer blogginnlegg ✦</button>

  <div class="spinner" id="spinner">
    <span class="dot-anim">Skriver</span>
  </div>

  <div id="outputCard">
    <h2>Ferdig innlegg</h2>
    <div id="outputText"></div>

      <button id="copyBtn">Kopier tekst</button>
      <button id="retryBtn">Generer på nytt</button>

</div>

<script>
const SYSTEM_PROMPT = `Du er en ekspert på innholdsskriving som alltid følger en tre-delt storytelling-struktur. Din skrivestil er menneskelig, varm og lettlest — aldri stiv, akademisk eller AI-klingende.

Hvert blogginnlegg du skriver skal følge denne strukturen:

---

DEL 1 — STORY (Historien / Kroken)

Start med en konkret scene, observasjon, opplevelse eller liten historie.

Historien skal:
- Føles ekte og menneskelig
- Inneholde små detaljer som gjør situasjonen levende
- Skape gjenkjennelse eller nysgjerrighet
- Trekke leseren inn emosjonelt
- Være enkel å visualisere

Bruk gjerne: et hverdagsøyeblikk, en liten frustrasjon, en samtale, en observasjon, en personlig erfaring, et overraskende øyeblikk, en kontrast eller et paradoks.

Unngå: lange introduksjoner, fakta først, generiske åpninger som "I dagens samfunn…"

Målet er at leseren skal tenke: "Jeg kjenner meg igjen." eller "Dette vil jeg lese videre."

---

DEL 2 — TRANSITION (Overgangen / Refleksjonen)

Beveg deg gradvis fra den konkrete historien til noe større og mer universelt.

Denne delen fungerer som en bro mellom det som skjedde og hvorfor det egentlig betyr noe.

Overgangen skal:
- Trekke ut et mønster, prinsipp eller observasjon
- Gjøre temaet relevant for leseren
- Skape refleksjon
- Utvide perspektivet uten å miste den varme tonen

Bruk gjerne formuleringer som: "Det fikk meg til å tenke på…", "Kanskje gjør vi alle dette…", "Det er merkelig hvordan…", "Jeg tror mange av oss…"

Denne delen skal føles naturlig og organisk — ikke som et hardt skifte.

---

DEL 3 — LESSON (Lærdommen / Verdien)

Avslutt med konkret verdi, innsikt eller praktisk lærdom.

Denne delen skal:
- Gi leseren noe nyttig å ta med seg
- Inneholde praktiske råd, prinsipper eller mentale modeller
- Føles enkel og anvendelig
- Bygge videre på historien og refleksjonen

Hold tonen varm og menneskelig. Ikke skriv som en lærebok. Ikke overforklar. Unngå moraliserende tone.

Avslutningen bør gi leseren følelsen av: "Dette kan jeg faktisk bruke." eller "Dette traff noe viktig."

---

STIL OG TONE — ALLTID:
- Varm, menneskelig og naturlig
- Rolig og trygg stemme
- Flyt mellom observasjon, refleksjon og lærdom
- Varierte setningslengder
- Lett å lese, men intelligent

ALDRI:
- AI-klingende eller generisk
- Stiv, corporate eller overdrevet markedsføringsspråk
- Full av punktlister
- Start med definisjon eller fakta

---

VIKTIGSTE PRINSIPP:
Leseren skal først FØLE noe, så FORSTÅ noe, og til slutt LÆRE noe. Ikke motsatt.

---

Returner kun selve blogginnlegget — ingen titler, ingen seksjonsoverskrifter, ingen forklaringer. Ren, flytende prosa.`;

async function generateBlog() {
  const topic    = document.getElementById('topic').value.trim();
  const audience = document.getElementById('audience').value.trim();
  const niche    = document.getElementById('niche').value.trim();
  const language = document.getElementById('language').value;
  const tone     = document.getElementById('tone').value;
  const length   = document.getElementById('length').value;
  const platform = document.getElementById('platform').value;
  const notes    = document.getElementById('notes').value.trim();
  const writingStyle = document.getElementById('writingStyle').value;

  const apiKey = document.getElementById('apiKey').value.trim();
  if (!apiKey) { alert('Lim inn Anthropic API-nøkkel først.'); return; }
  if (!topic) {
    alert('Skriv inn et tema før du genererer.');
    return;
  }

  const btn = document.getElementById('generateBtn');
  const spinner = document.getElementById('spinner');
  const outputCard = document.getElementById('outputCard');
  const outputText = document.getElementById('outputText');

  btn.disabled = true;
  spinner.classList.add('active');
  outputCard.style.display = 'none';
  outputText.textContent = '';

  const userPrompt = `Skriv et blogginnlegg med følgende spesifikasjoner:

- Tema: ${topic}
- Målgruppe: ${audience || 'Generell, voksen leser'}
- Nisje: ${niche || 'Generell'}
- Språk: ${language}
- Tone: ${tone}
- Lengde: ${length}
- Plattform: ${platform}
${notes ? `- Tilleggsnoter: ${notes}` : ''}
${writingStyle === 'rimmerman_halbert' ? `- Skrivestil: Skriv teksten i en hybrid stil som kombinerer Jon Rimmerman og Gary Halbert. Begynn med Rimmermans verden: narrativ, sanselig og reiseaktig — full av lys, vær, tilfeldigheter, menneskemøter og de små detaljene som bare en som faktisk var der ville legge merke til. La stemningen bygge seg opp organisk, som om teksten ikke har noe bestemt sted å gå. Bruk lange, flytende avsnitt når du etablerer kontekst, terroir og følelse. Så — uten varsel — skift til Halberts register: direkte, personlig, psykologisk presis. Kutt setningslengden. Si det ingen andre tør si. Snakk til leseren som om dere er alene i rommet og du har noe viktig å fortelle. Denne overgangen fra det poetiske til det ufiltrerte er selve hjertet i stilen. Unngå markedsføringsspråk og salgsklisjeer — overtalelsen skjer gjennom ærlighet og nærvær, ikke teknikk. Skriv i første person. Avslutt med en subtil invitasjon som føles som et tilbud mellom venner, ikke en call-to-action.`  : writingStyle === 'rimmerman' ? `- Skrivestil: ${'Skriv teksten i stilen til Jon Rimmerman fra Garagiste. Bruk en lang, narrativ, nesten litterær form. Teksten skal føles som en personlig reiseberetning forkledd som en e-post. Bruk et rytmisk språk med sanselige detaljer, tilfeldige observasjoner, små digresjoner og en følelse av at avsenderen har snublet over noe sjeldent. Vekten skal ligge på stemning, terroir, mennesker, vær, tilfeldigheter og kontekst – ikke salgstaktikker. Teksten skal være varm, nysgjerrig, litt mystisk og skrevet som om leseren er en del av en eksklusiv indre sirkel. Unngå markedsføringsspråk. Skriv med en tone som kombinerer reiseskildring, dagboknotat og poetisk vinjournalistikk. Avslutt med en subtil invitasjon, ikke en call-to-action. Bruk første person.'}`  : ''}

Følg Story → Transition → Lesson-strukturen nøye. Returner kun selve innlegget som ren prosa.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
          'Content-Type': 'application/json',
          'anthropic-dangerous-direct-browser-access': 'true',
          'x-api-key': document.getElementById('apiKey').value.trim(),
          'anthropic-version': '2023-06-01'
        },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    const data = await response.json();

    if (!response.ok) {
      outputText.textContent = 'API-feil ' + response.status + ': ' + JSON.stringify(data);
      outputCard.style.display = 'block';
      return;
    }

    const text = data.content?.map(b => b.text || '').join('') || 'Ingen tekst generert.';

    outputText.textContent = text;
    outputCard.style.display = 'block';
    outputCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    outputText.textContent = 'Feil: ' + err.message;
    outputCard.style.display = 'block';
    console.error('Full error:', err);
  } finally {
    btn.disabled = false;
    spinner.classList.remove('active');
  }
}

document.getElementById('generateBtn').addEventListener('click', generateBlog);

document.getElementById('retryBtn').addEventListener('click', generateBlog);

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = document.getElementById('outputText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = 'Kopiert ✓';
    setTimeout(() => btn.textContent = 'Kopier tekst', 2000);
  });
});
</script>
