function handleFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const all = parseCSV(text);
    if (all.length < 2) { alert('CSV appears empty or unreadable.'); return; }
    parsedHeaders = all[0];
    parsedRows    = all.slice(1);

    // Count unique products (by Handle)
    const hIdx = parsedHeaders.indexOf('Handle');
    const handles = new Set();
    for (const r of parsedRows) {
      const h = hIdx >= 0 ? r[hIdx] : null;
      if (h) handles.add(h);
    }
    const productCount = handles.size;

    fileInfo.innerHTML = `Loaded <strong>${file.name}</strong> &nbsp;·&nbsp; ${parsedRows.length} rows &nbsp;·&nbsp; <strong>${productCount} unique products</strong>`;
    fileInfo.classList.add('visible');

    // Preview first 5 unique products
    buildPreview(productCount);
    checkReady();
  };
  reader.readAsText(file, 'UTF-8');
}

function buildPreview(count) {
  const cols = ['Handle', 'Title', 'SEO Title', 'SEO Description'];
  const idxs = cols.map(c => parsedHeaders.indexOf(c));

  let html = '<thead><tr>';
  for (const c of cols) html += `<th>${c}</th>`;
  html += '</tr></thead><tbody>';

  const seen = new Set();
  let shown = 0;
  for (const row of parsedRows) {
    const handle = row[idxs[0]] || '';
    if (seen.has(handle)) continue;
    seen.add(handle);
    html += '<tr>';
    for (const idx of idxs) html += `<td title="${(row[idx]||'').replace(/"/g,'&quot;')}">${row[idx] || '<em style="opacity:.4">—</em>'}</td>`;
    html += '</tr>';
    if (++shown >= 5) break;
  }
  html += '</tbody>';
  previewTable.innerHTML = html;
  previewWrap.classList.add('visible');
}

// ── The Hemingway + Art Seller prompt ────────────────────────────────────────
function buildPrompt(title, bodyHTML, existingSeoTitle, existingSeoDesc, altText) {
  return `You are writing product copy for HareideART, a fine art print shop selling original Norwegian-themed artworks — landscapes, historical scenes, abstract pieces, portraits.

WRITING STYLE: Hemingway. Short declarative sentences. No adjective stacking. Concrete and visual. Trust the reader. No sentimentality, no clichés. Strong nouns, active verbs. The art speaks — you simply introduce it.

SALES MODE: Art Seller (9-step Cialdini sequence)
1. Liking — warm, personal opener that connects artist to viewer
2. Authority — one concrete credential or provenance detail
3. Visual — describe what the eye actually sees, physically, precisely
4. Social Proof — imply desirability subtly (limited, sought-after, collected)
5. Scarcity — one specific limitation (edition size, original digital painting, etc.)
6. Reciprocity — offer something extra in spirit (care guide, story behind the work)
7. Consistency — small agreement before the ask
8. Facts — dimensions, medium, print quality, fulfillment note
9. CTA — one sentence, specific, with quiet urgency

PRODUCT DATA:
Title: ${title}
Description (HTML): ${bodyHTML}
Current SEO Title: ${existingSeoTitle}
Current SEO Description: ${existingSeoDesc}
Current Image Alt Text: ${altText}

OUTPUT: Return ONLY a valid JSON object, no markdown, no backticks, no preamble:
{
  "title": "Improved product title (max 70 chars, keyword-rich, Hemingway)",
  "bodyHTML": "Full product description as plain HTML using <p> tags only. Apply all 9 Art Seller steps. 180–260 words. No <h1>–<h6>, no <ul>/<li>.",
  "seoTitle": "SEO title max 60 chars",
  "seoDescription": "SEO meta description max 155 chars — benefit-led, human, no keyword stuffing",
  "imageAltText": "Descriptive alt text max 125 chars — describe the image visually for accessibility and SEO"
}`;
}

// ── Claude API call ───────────────────────────────────────────────────────────
async function callClaude(apiKey, prompt) {
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      messages: [{ role: 'user', content: prompt }]
    })
  });
  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err?.error?.message || `HTTP ${response.status}`);
  }
  const data = await response.json();
  const text = data.content.map(b => b.text || '').join('');
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

function log(msg, type = '') {
  const div = document.createElement('div');
  div.className = type;
  div.textContent = msg;
  progressLog.appendChild(div);
  progressLog.scrollTop = progressLog.scrollHeight;
}

// ── Main run ──────────────────────────────────────────────────────────────────
runBtn.addEventListener('click', async () => {
  const apiKey = apiKeyEl.value.trim();
  if (!apiKey) return;
  runError.style.display = 'none';

  // Pre-flight check
  if (parsedRows.length === 0) {
    runError.style.display = 'block';
    runError.textContent = 'No CSV loaded. Please upload a Shopify products CSV first.';
    return;
  }

  // Column indices
  const col = name => parsedHeaders.indexOf(name);
  const iHandle   = col('Handle');
  const iTitle    = col('Title');
  const iBody     = col('Body (HTML)');
  const iSeoT     = col('SEO Title');
  const iSeoD     = col('SEO Description');
  const iAlt      = col('Image Alt Text');

  // Group rows by handle
  const productMap = new Map(); // handle → [row indices]
  for (let i = 0; i < parsedRows.length; i++) {
    const h = parsedRows[i][iHandle] || '';
    if (!productMap.has(h)) productMap.set(h, []);
    productMap.get(h).push(i);
  }

  const handles = [...productMap.keys()].filter(h => {
    // Only process handles where Title is on first row (main product rows)
    const firstRow = parsedRows[productMap.get(h)[0]];
    return firstRow[iTitle] && firstRow[iTitle].trim() !== '';
  }).slice(0, 50);

  const total = handles.length;

  // Reset UI
  outputRows = parsedRows.map(r => [...r]); // deep copy
  progressSection.classList.add('visible');
  downloadSection.classList.remove('visible');
  progressLog.innerHTML = '';
  progressFill.style.width = '0%';
  progressCount.textContent = `0 / ${total}`;
  runBtn.disabled = true;
  runBtnText.innerHTML = '<span class="spinner"></span> &nbsp;Processing…';

  let done = 0, errors = 0;

  for (const handle of handles) {
    const rowIdxs = productMap.get(handle);
    const firstIdx = rowIdxs[0];
    const row = parsedRows[firstIdx];

    const title   = row[iTitle]  || '';
    const body    = row[iBody]   || '';
    const seoT    = row[iSeoT]   || '';
    const seoD    = row[iSeoD]   || '';
    const altText = row[iAlt]    || '';

    log(`▶ Processing: ${title || handle}`, 'log-working');

    try {
      const result = await callClaude(apiKey, buildPrompt(title, body, seoT, seoD, altText));

      // Apply to all rows sharing this handle
      for (const idx of rowIdxs) {
        if (iTitle >= 0) outputRows[idx][iTitle] = result.title    || outputRows[idx][iTitle];
        if (iBody  >= 0) outputRows[idx][iBody]  = result.bodyHTML || outputRows[idx][iBody];
        if (iSeoT  >= 0) outputRows[idx][iSeoT]  = result.seoTitle || outputRows[idx][iSeoT];
        if (iSeoD  >= 0) outputRows[idx][iSeoD]  = result.seoDescription || outputRows[idx][iSeoD];
        if (iAlt   >= 0) outputRows[idx][iAlt]   = result.imageAltText || outputRows[idx][iAlt];
      }

      log(`✓ Done: ${result.title || title}`, 'log-ok');
    } catch (err) {
      errors++;
      log(`✗ Error on "${title || handle}": ${err.message}`, 'log-err');
      if (done === 1) {
        runError.style.display = 'block';
        runError.innerHTML = `<strong>API error on first product:</strong> ${err.message}<br>Check your API key and try the Test button above.`;
      }
    }

    done++;
    progressCount.textContent = `${done} / ${total}`;
    progressFill.style.width = `${Math.round((done / total) * 100)}%`;

    // Small delay to avoid rate limits
    if (done < total) await new Promise(r => setTimeout(r, 400));
  }

  // Done
  runBtnText.textContent = 'Run PersuadeKit';
  runBtn.disabled = false;

  downloadStats.innerHTML =
    `Processed: <strong>${done}</strong> products &nbsp;·&nbsp; ` +
    `Errors: <strong style="color:${errors > 0 ? '#d4a574' : '#a8c4a2'}">${errors}</strong> &nbsp;·&nbsp; ` +
    `Total rows in CSV: <strong>${outputRows.length}</strong>`;
  downloadSection.classList.add('visible');
  log('─── Complete ───', 'log-ok');
});

// ── Download ──────────────────────────────────────────────────────────────────
downloadBtn.addEventListener('click', () => {
  const csv = rowsToCSV(parsedHeaders, outputRows);
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `hareideart_seo_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
});
</script>
